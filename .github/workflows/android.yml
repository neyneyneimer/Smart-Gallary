name: Android build

on:
  push:
    branches:
      - main
      - android/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.AURA_RELEASE_KEYSTORE_BASE64 != '' && secrets.AURA_RELEASE_STORE_PASSWORD != '' && secrets.AURA_RELEASE_KEY_ALIAS != '' && secrets.AURA_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace :app:check :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify and print exported Room schema v6
        run: |
          test -f app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/6.json
          cat app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/6.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-gallery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release validation APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-gallery-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Decode release keystore
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          AURA_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AURA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aura-release.p12"
          test -s "$RUNNER_TEMP/aura-release.p12"
      - name: Build signed release
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          AURA_RELEASE_STORE_FILE: ${{ runner.temp }}/aura-release.p12
          AURA_RELEASE_STORE_PASSWORD: ${{ secrets.AURA_RELEASE_STORE_PASSWORD }}
          AURA_RELEASE_KEY_ALIAS: ${{ secrets.AURA_RELEASE_KEY_ALIAS }}
          AURA_RELEASE_KEY_PASSWORD: ${{ secrets.AURA_RELEASE_KEY_PASSWORD }}
          AURA_RELEASE_STORE_TYPE: ${{ vars.AURA_RELEASE_STORE_TYPE || 'PKCS12' }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-gallery-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
