name: Android build

on:
  push:
    branches:
      - main
      - android/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon :app:check :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and print exported Room schema v6
        run: |
          test -f app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/6.json
          cat app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/6.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-gallery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
